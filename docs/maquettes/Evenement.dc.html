<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvel événement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E5A50}a:hover{color:#143F38}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; box-sizing: border-box; background: #F3F5F2; font-family: 'Figtree', sans-serif; color: #18201E">

<div style="height: 56px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; background: #F3F5F2">
<a href="Calendrier.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 600; text-decoration: none">Annuler</a>
<div style="font-size: 17px; font-weight: 700">Nouvel événement</div>
<div style="width: 76px"></div>
</div>

<form style="padding: 8px 20px 120px; display: flex; flex-direction: column; gap: 20px">

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 10px">Type</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2F6FD0"></span>Vaccin</button>
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #1E5A50; background: #1E5A50; font-family: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>Vermifuge</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7B4FC9"></span>Antiparasitaire</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4423A"></span>Véto</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1E5A50"></span>Éducateur</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E">Séjour</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D3D9D6; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #18201E">Autre</button>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="titre" style="font-size: 15px; font-weight: 600">Titre</label>
<input id="titre" type="text" value="Vermifuge" style="height: 52px; border-radius: 14px; border: 1.5px solid #D3D9D6; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #18201E; box-sizing: border-box">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="date" style="font-size: 15px; font-weight: 600">Date</label>
<input id="date" type="text" value="17 oct. 2026" style="height: 52px; border-radius: 14px; border: 1.5px solid #D3D9D6; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #18201E; box-sizing: border-box; width: 100%">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="heure" style="font-size: 15px; font-weight: 600">Heure <span style="font-weight: 400; color: #5A6662">(option)</span></label>
<input id="heure" type="text" placeholder="--:--" style="height: 52px; border-radius: 14px; border: 1.5px solid #D3D9D6; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #18201E; box-sizing: border-box; width: 100%">
</div>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 10px">Se répète</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #E4E8E4; border-radius: 14px; padding: 4px; gap: 4px">
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #3F4946">Jamais</button>
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #3F4946">Mois</button>
<button type="button" aria-pressed="true" style="height: 44px; border: none; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(24,32,30,0.12); font-family: inherit; font-size: 14px; font-weight: 700; color: #18201E">3 mois</button>
<button type="button" aria-pressed="false" style="height: 44px; border: none; border-radius: 10px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #3F4946">An</button>
</div>
<div style="font-size: 13px; color: #5A6662; margin-top: 8px">Suggéré pour un vermifuge. Le suivant sera créé quand tu marqueras celui-ci comme fait.</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="note" style="font-size: 15px; font-weight: 600">Note <span style="font-weight: 400; color: #5A6662">(option)</span></label>
<textarea id="note" rows="3" placeholder="Produit, dose, remarque…" style="border-radius: 14px; border: 1.5px solid #D3D9D6; background: #FFFFFF; padding: 14px 16px; font-family: inherit; font-size: 16px; color: #18201E; box-sizing: border-box; resize: none"></textarea>
</div>

<a href="Document.dc.html" style="height: 52px; border-radius: 14px; border: 1.5px dashed #9AA39F; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.2a1.7 1.7 0 0 1-2.4-2.4L15 7"></path></svg>Joindre un document</a>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 32px; background: #F3F5F2; border-top: 1px solid #E6EAE7">
<a href="Calendrier.dc.html" style="height: 54px; border-radius: 27px; background: #1E5A50; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Enregistrer</a>
</div>

</div>
</x-dc>

</body>
</html>
