<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Billy · Proposition</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Figtree:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e5a50}a:hover{color:#143f38}
button{font-family:inherit}
.tap{transition:transform 150ms cubic-bezier(.2,.8,.3,1)}
.tap:active{transform:scale(.97)}
.rise{animation:rise 400ms cubic-bezier(.2,.8,.3,1) both}
.open{animation:open 250ms cubic-bezier(.2,.8,.3,1) both}
.paw-next{animation:breathe 1600ms ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f3f5f2; font-family: Figtree, system-ui, sans-serif; color: #18201e;">

  <div style="position: absolute; inset: 0 0 84px 0; overflow-y: auto; padding: 16px 16px 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="Main.dc.html" class="tap" style="height: 44px; padding: 0 16px 0 10px; border-radius: 9999px; border: 2px solid #d3d9d6; box-sizing: border-box; background: #ffffff; display: flex; align-items: center; gap: 4px; text-decoration: none; color: #18201e; font-weight: 700; font-size: 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="#18201e" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>Accueil</a>
      <a href="#" class="tap" aria-label="23 os, voir la boutique" style="height: 44px; padding: 0 14px; border-radius: 9999px; background: #fcefd3; display: flex; align-items: center; gap: 6px; text-decoration: none; color: #3d2a00; font-weight: 800; font-size: 18px;">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8.2a2.6 2.6 0 1 1 2.7-3.7l7 7a2.6 2.6 0 1 1 3.7 2.7 2.6 2.6 0 1 1-2.7 3.7l-7-7A2.6 2.6 0 1 1 6 8.2z" fill="#f6e7c8" stroke="#8a6514" stroke-width="1.6" stroke-linejoin="round"/></svg>23</a>
    </div>

    <div class="rise" style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 9999px; background: #fbe6d4; border: 3px solid #d9661f; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; color: #8a3e0c;">O</span>
      <span style="display: flex; flex-direction: column;">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 34px;">Oslo</span>
        <span style="font-size: 15px; color: #5a6662;">3 mois · 6 mois le 10 janvier 2027</span>
      </span>
    </div>

    <h2 class="rise" style="animation-delay: 80ms; margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px;">Ce qu’il apprend</h2>
    <div class="rise" style="animation-delay: 120ms; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{skills}}" as="k" hint-placeholder-count="3">
        <button class="tap" onClick="{{k.pick}}" aria-expanded="{{k.on}}" style="border-radius: 20px; border: {{k.border}}; background: #ffffff; box-shadow: 0 1px 2px rgba(24,32,30,0.06); padding: 14px 16px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: left; cursor: pointer; color: #18201e;">
          <span style="font-weight: 700; font-size: 16px; line-height: 22px;">{{k.titre}}</span>
          <span role="img" aria-label="{{k.pawLabel}}" style="display: flex; gap: 6px;">
            <svg class="{{k.firstCls}}" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="#fcefd3" stroke="#8a6514" stroke-width="1.2" stroke-dasharray="2 2"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6.5" r="2"/><circle cx="14" cy="6.5" r="2"/><circle cx="18" cy="10" r="2"/></g></svg>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#c4ccc8" stroke-width="1.4"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6.5" r="2"/><circle cx="14" cy="6.5" r="2"/><circle cx="18" cy="10" r="2"/></g></svg>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#c4ccc8" stroke-width="1.4"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6.5" r="2"/><circle cx="14" cy="6.5" r="2"/><circle cx="18" cy="10" r="2"/></g></svg>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#c4ccc8" stroke-width="1.4"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="2"/><circle cx="10" cy="6.5" r="2"/><circle cx="14" cy="6.5" r="2"/><circle cx="18" cy="10" r="2"/></g></svg>
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0zM12 12v4M8 20h8M10 16h4" fill="none" stroke="#c4ccc8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <sc-if value="{{k.on}}" hint-placeholder-val="{{false}}">
            <span class="open" style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #e6eae7;">
              <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.6px; color: #8a3e0c;">PROCHAINE ÉTAPE</span>
              <span style="font-size: 16px; color: #3f4946;">{{k.next}}</span>
              <span style="font-size: 15px; font-weight: 700; color: #1e5a50; margin-top: 4px;">Voir tout son chemin ›</span>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div class="rise" style="animation-delay: 200ms; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
      <a href="#" class="tap" style="min-height: 88px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(24,32,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #18201e;"><b style="font-size: 16px;">La boutique</b><span style="font-size: 14px; color: #5a6662;">23 os à dépenser</span></a>
      <a href="#" class="tap" style="min-height: 88px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(24,32,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #18201e;"><b style="font-size: 16px;">La meute</b><span style="font-size: 14px; color: #5a6662;">Les spots et les amis</span></a>
      <a href="#" class="tap" style="min-height: 88px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(24,32,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #18201e;"><b style="font-size: 16px;">Ce qui l’inquiète</b><span style="font-size: 14px; color: #5a6662;">Rien de noté</span></a>
      <a href="#" class="tap" style="min-height: 88px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(24,32,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #18201e;"><b style="font-size: 16px;">Son profil</b><span style="font-size: 14px; color: #5a6662;">Puce, véto, réglages</span></a>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 84px; padding: 24px 16px 12px; background: linear-gradient(rgba(243,245,242,0), #f3f5f2 40%);">
    <a href="#" class="tap" style="height: 56px; border-radius: 9999px; background: #bf5519; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 18px; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#ffffff" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="#ffffff"/></svg>S’entraîner · 3 min</a>
  </div>

  <nav aria-label="Onglets" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #ffffff; border-top: 1px solid #e6eae7; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; padding-bottom: 10px; box-sizing: border-box;">
    <a href="Carte-Proposition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #3f4946; font-weight: 700; font-size: 13px;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#3f4946" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Balades</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #3f4946; font-weight: 700; font-size: 13px;">
      <span style="width: 60px; height: 60px; margin-top: -30px; border-radius: 9999px; background: #1e5a50; border: 4px solid #ffffff; box-shadow: 0 6px 16px rgba(30,90,80,0.35); display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></span>Accueil</a>
    <a href="Sante-Proposition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #3f4946; font-weight: 700; font-size: 13px;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#3f4946" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Santé</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'lien' }; }
  renderVals() {
    const list = [
      { id: 'lien', titre: 'Répond à son nom et me regarde, même dehors', next: 'Regarde quand on l’appelle dans une rue calme.' },
      { id: 'decouverte', titre: 'Explore un objet, un sol, un son ou un reflet inconnu sans paniquer', next: 'La première étape de son chemin.' },
      { id: 'soins', titre: 'Accepte brossage, oreilles, pattes, examen chez le véto', next: 'La première étape de son chemin.' }
    ];
    const skills = list.map((k) => {
      const on = this.state.sel === k.id;
      return { ...k, on: on, border: on ? '2px solid #1e5a50' : '2px solid transparent', firstCls: on ? 'paw-next' : '', pawLabel: 'Première patte en route, puis le trophée', pick: () => this.setState({ sel: on ? null : k.id }) };
    });
    return { skills: skills };
  }
}
</script>
</body>
</html>
