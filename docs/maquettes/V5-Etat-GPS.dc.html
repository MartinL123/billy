<!doctype html>

<head>
<meta charset="utf-8">
<title>Balade · signal GPS faible</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Figtree:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e5a50}a:hover{color:#143f38}
.search{animation:search 1400ms ease-in-out infinite}
@keyframes search{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #e7ebe5; font-family: Figtree, system-ui, sans-serif; color: #18201e;">
  <svg width="390" height="600" viewBox="0 0 390 600" role="img" aria-label="Carte : le tracé s'interrompt en pointillés là où le GPS a perdu le signal" style="position: absolute; left: 0; top: 0;">
    <defs>
      <filter id="eg-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
      <mask id="eg-fog"><rect width="390" height="600" fill="#ffffff"/><g filter="url(#eg-blur)" fill="none" stroke="#000000" stroke-linecap="round" stroke-width="90"><path d="M150 170 L 120 260 L 210 380"/></g></mask>
    </defs>
    <rect width="390" height="600" fill="#e7ebe5"/>
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"><path d="M40 40 L 330 420"/><path d="M-10 230 L 400 120"/><path d="M60 300 L 400 560"/><path d="M200 -10 L 120 620"/></g>
    <rect width="390" height="600" fill="#1f3a34" fill-opacity="0.8" mask="url(#eg-fog)"/>
    <path d="M150 170 L 120 260" stroke="#f2b544" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M120 260 L 210 380" stroke="#f2b544" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 12"/>
    <circle cx="210" cy="380" r="22" fill="#2f80d0" fill-opacity="0.18"/>
    <circle cx="210" cy="380" r="10" fill="#9aa39f" stroke="#ffffff" stroke-width="3"/>
  </svg>
  <div role="status" style="position: absolute; left: 16px; right: 16px; top: 16px; padding: 12px 16px; border-radius: 16px; background: #ffffff; box-shadow: 0 4px 12px rgba(24,32,30,0.18); display: flex; align-items: center; gap: 12px;">
    <svg class="search" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2559a8" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/></svg>
    <span style="font-size: 15px;"><b>Le GPS cherche le ciel.</b> La balade continue, le tracé se recolle tout seul.</span>
  </div>
  <section style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 26px 26px 0 0; box-shadow: 0 -4px 18px rgba(24,32,30,0.18); padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 14px;">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.6px; color: #8a3e0c;">BALADE EN COURS AVEC OSLO</span>
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column;"><span style="font-size: 14px; color: #5a6662; font-weight: 600;">Durée</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 48px; line-height: 52px;">22<span style="font-size: 24px;"> min </span><span style="font-size: 30px; color: #3f4946;">40</span><span style="font-size: 20px; color: #3f4946;"> s</span></span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;"><span style="font-size: 14px; color: #5a6662; font-weight: 600;">Distance</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 40px; color: #1e5a50;">≈ 1,4 km</span></div>
    </div>
    <span style="font-size: 15px; color: #3f4946;">La distance sera recalculée quand le signal revient.</span>
    <span style="height: 58px; border-radius: 9999px; background: #bf5519; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px;">Terminer</span>
  </section>
</div>
</x-dc>
