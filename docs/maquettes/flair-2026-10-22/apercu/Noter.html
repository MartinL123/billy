<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Noter un souvenir</title>

</head>
<body>
<div class="dc">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>

<div style="width: 390px; height: 844px; background: #F3F5F2; color: #18201E; font-family: Figtree, system-ui, sans-serif; font-size: 16px; line-height: 1.45; box-sizing: border-box; padding: 50px 16px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px">
    <a href="Main.html" style="color: #1E5A50; font-weight: 700; text-decoration: none">Annuler</a>
    <div style="font-weight: 700">Un souvenir</div><span></span>
  </div>
  <button type="button" style="height: 190px; border-radius: 20px; border: 2px dashed #8FA59E; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #1E5A50; font: 700 16px Figtree, sans-serif">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E5A50" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M3 17l5-5 4 4 3-3 6 6"></path></svg>
    Ajouter une photo
  </button>
  <label for="mot" style="font: 600 17px/1.2 'Bricolage Grotesque', sans-serif">Un mot ?</label>
  <textarea id="mot" placeholder="Une balade, un jeu, un progrès de Billy…" style="height: 96px; border-radius: 14px; border: 1px solid #D3D9D6; background: #fff; padding: 12px 14px; font: 16px Figtree, sans-serif; resize: none; margin-top: -6px"></textarea>
  <div style="font: 600 17px/1.2 'Bricolage Grotesque', sans-serif">Comment c'était ?</div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 96px; border-radius: 16px; border: 1px solid #D3D9D6; background: #fff; font: 700 15px Figtree, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#18201E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 16c1-1.5 2.4-2 4-2s3 .5 4 2M9 10h.01M15 10h.01"></path></svg>Difficile</button>
    <button type="button" style="height: 96px; border-radius: 16px; border: 1px solid #D3D9D6; background: #fff; font: 700 15px Figtree, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#18201E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 15h8M9 10h.01M15 10h.01"></path></svg>Bien</button>
    <button type="button" style="height: 96px; border-radius: 16px; border: 1px solid #D3D9D6; background: #fff; font: 700 15px Figtree, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#18201E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14c1 2 2.4 3 4 3s3-1 4-3M9 10h.01M15 10h.01"></path></svg>Super</button>
  </div>
  <div style="flex: 1"></div>
  <a href="Journal.html" style="height: 56px; border-radius: 999px; background: #BF5519; color: #fff; font: 700 17px Figtree, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Enregistrer</a>
</div>
</div>

</body>
</html>
